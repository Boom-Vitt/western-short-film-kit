<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Western Short Film Kit</title>
  <desc id="desc">A typographic banner with a stylized elevator and a vertical composition guide. Concept graphic, not a rendered film.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d28"/><stop offset="1" stop-color="#24404b"/></linearGradient>
    <linearGradient id="door"><stop stop-color="#49636b"/><stop offset=".5" stop-color="#162b35"/><stop offset="1" stop-color="#56717b"/></linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <path d="M0 532H1600M0 540H1600" stroke="#d6bd8b" opacity=".28"/>
  <g fill="#d6bd8b" font-family="Arial, sans-serif">
    <text x="88" y="99" font-size="22" letter-spacing="5">BOOMBIGNOSE / FILMMAKING STARTER KIT</text>
    <text x="82" y="232" font-size="90" font-weight="700" letter-spacing="-3">WESTERN</text>
    <text x="82" y="327" font-size="90" font-weight="700" letter-spacing="-3">SHORT FILM KIT</text>
    <text x="88" y="401" font-size="24" fill="#dce8ea">Original stories. Vertical cinema. Your direction.</text>
    <rect x="88" y="448" width="270" height="43" rx="21" fill="#d6bd8b"/>
    <text x="112" y="477" font-size="18" font-weight="700" fill="#182d36">9:16 / PROMPT + WORKFLOW</text>
    <text x="380" y="477" font-size="19" fill="#dce8ea">FREE / MIT / THAI GUIDE</text>
  </g>
  <rect x="1210" y="60" width="264" height="470" rx="16" fill="#0b1a23" stroke="#d6bd8b" stroke-width="2"/>
  <rect x="1234" y="123" width="216" height="387" fill="url(#door)"/>
  <path d="M1342 123V510" stroke="#0c171e" stroke-width="8"/>
  <rect x="1308" y="80" width="68" height="24" rx="3" fill="#d6bd8b"/>
  <path d="M1334 88L1342 96L1350 88" fill="none" stroke="#182d36" stroke-width="2"/>
  <path d="M1210 186H1474M1210 404H1474M1257 60V530M1427 60V530" stroke="#d6bd8b" opacity=".15" stroke-dasharray="5 8"/>
  <text x="1342" y="566" text-anchor="middle" font-size="16" letter-spacing="3" font-family="Arial, sans-serif" fill="#d6bd8b">ONE FRAME. ONE STORY.</text>
</svg>
